
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CyberX AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b19;color:white;font-family:Arial,sans-serif}
header{padding:22px;text-align:center;background:#101936;border-bottom:1px solid #344477}
h1{color:#9b8cff;margin:0;font-size:32px}
header p{color:#aab5d5}
main{max-width:950px;margin:35px auto;padding:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card,.panel{background:#111a35;border:1px solid #344477;border-radius:18px;padding:22px}
.card h2{color:#a78bfa}
p{color:#b7c3df;line-height:1.7}
button,a{display:inline-block;border:0;border-radius:10px;padding:12px 17px;
background:linear-gradient(90deg,#2563eb,#9333ea);color:white;
text-decoration:none;font-weight:bold;cursor:pointer;margin:5px}
.panel{margin-top:22px}
textarea{width:100%;height:120px;background:#080e20;color:white;
border:1px solid #485784;border-radius:12px;padding:13px;font-size:16px}
#answer{white-space:pre-wrap;line-height:1.8;margin-top:15px}
footer{text-align:center;color:#7e8aaa;padding:25px}
</style>
</head>
<body>
<header>
<h1>CyberX AI</h1>
<p>Smart Education Assistant</p>
</header>
<main>
<div class="cards">
 <div class="card">
  <h2>💻 Qureo Python</h2>
  <p>منصة البرمجة والتدريبات العملية.</p>
  <a href="https://me-portal.qureo.education/" target="_blank">فتح المنصة</a>
  <a href="https://me-tp.qureo.education/chapter/511025/lecture/511025010" target="_blank">فتح الدرس</a>
 </div>
 <div class="card">
  <h2>📊 الثقافة المالية</h2>
  <p>منصة الثقافة المالية والتدريبات.</p>
  <a href="https://egy.app.spx-learning-square.com/login" target="_blank">فتح المنصة</a>
 </div>
</div>

<div class="panel">
 <h2>🤖 CyberX AI Assistant</h2>
 <p>اكتب سؤال التدريب للحصول على تحليل وشرح للحل.</p>
 <textarea id="question" placeholder="اكتب السؤال هنا..."></textarea>
 <button onclick="solve()">تحليل السؤال</button>
 <div id="answer"></div>
</div>
</main>
<footer>CyberX AI © 2026</footer>
<script>
function solve(){
 const q=document.getElementById('question').value.trim();
 const out=document.getElementById('answer');
 if(!q){out.textContent='اكتب السؤال أولاً.';return;}
 out.textContent='تم استلام السؤال. يلزم ربط خادم ذكاء اصطناعي آمن لتوليد الحل. هذه النسخة لا تنفذ الحل تلقائياً داخل المنصات بعد.';
}
</script>
</body>
</html>
